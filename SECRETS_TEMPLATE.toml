# =============================================================================
# CommunityLab — Plantilla de Secrets para Streamlit (.streamlit/secrets.toml)
# =============================================================================
# INSTRUCCIONES PARA EL ENCARGADO / ADMINISTRADOR:
# 1. Rellena los campos con las credenciales de la Service Account de Google Cloud.
# 2. Guarda o copia este archivo como: .streamlit/secrets.toml
# 3. Comparte el Google Sheet indicado abajo con permisos de 'Editor' hacia el 'client_email'.
# =============================================================================

# ID de la hoja de cálculo de Google Sheets (lo que está entre /d/ y /edit en la URL)
spreadsheet_id = "PEGA_AQUI_TU_SPREADSHEET_ID"

# Nombre exacto de la pestaña (debe llamarse Curaduria)
worksheet_name = "Curaduria"

[gcp_service_account]
type = "service_account"
project_id = "tu-proyecto-gcp"
private_key_id = "pega_aqui_tu_private_key_id"
private_key = "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n"
client_email = "communitylab-curador@tu-proyecto-gcp.iam.gserviceaccount.com"
client_id = "109876543210987654321"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/communitylab-curador%40tu-proyecto-gcp.iam.gserviceaccount.com"
